# Local infrastructure for ammrambha_courier. Start it with:  docker compose up -d
# Optional — the API also runs with NO Redis, and against any MongoDB (e.g. Atlas).
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mongo-data:
